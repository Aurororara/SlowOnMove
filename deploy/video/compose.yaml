name: slowonmove-video
services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    volumes:
      - ../../backend/.group-video/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${VIDEO_BIND_ADDRESS:-127.0.0.1}:7880:7880/tcp"
      - "${VIDEO_BIND_ADDRESS:-127.0.0.1}:7881:7881/tcp"
      - "${VIDEO_BIND_ADDRESS:-127.0.0.1}:7882:7882/udp"
